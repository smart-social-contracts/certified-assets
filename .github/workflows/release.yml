name: Build and Release Asset Canister WASM

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build WASM and create release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          target: wasm32-unknown-unknown

      - name: Build asset canister WASM
        run: cargo build --target wasm32-unknown-unknown --release -p canister

      - name: Compress WASM
        run: gzip -c target/wasm32-unknown-unknown/release/canister.wasm > assetstorage.wasm.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2
        with:
          files: assetstorage.wasm.gz
          generate_release_notes: true
